<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Go Button — Sheet Test</title>

<style>

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ea9a99;
    color: #000000;
    padding: 40px;
}

h1,
#status,
#artists {
    background: #ffffff;
    padding: 15px;
}

#artists {
    margin-top: 20px;
    max-width: 500px;
}

.artist {
    padding: 8px 0;
    font-weight: bold;
}

</style>

</head>


<body>

<h1>HALL OF FAME TEST</h1>

<div id="status">
    Connecting to Google Sheets...
</div>

<div id="artists"></div>


<script>


const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vROCpvGvyzvKRuWzaHYeo6y0mYfdvpEOnctgL0HM26KjWEPy7PAl16ChP0IT2MD6pTxt2mJ0hH0x40s/pub?gid=1402967077&single=true&output=csv";


async function loadArtists() {

    try {

        const response =
            await fetch(sheetURL);


        if (!response.ok) {

            throw new Error(
                "Google Sheets returned an error."
            );

        }


        const csv =
            await response.text();


        /*
         * Split the CSV into rows.
         */

        const rows =
            csv
                .split(/\r?\n/)
                .map(
                    row => row.trim()
                )
                .filter(
                    row => row !== ""
                );


        const artists = [];


        /*
         * The first row is the heading.
         *
         * Everything underneath it
         * is an artist.
         */

        rows.slice(1).forEach(
            function(row) {

                const name =
                    row
                        .replace(
                            /^"|"$/g,
                            ""
                        )
                        .trim();


                if (
                    name
                ) {

                    artists.push(name);

                }

            }
        );


        /*
         * SUCCESS
         */

        document.getElementById(
            "status"
        ).textContent =
            "SUCCESS — " +
            artists.length +
            " artist(s) found.";


        /*
         * DISPLAY ARTISTS
         */

        const container =
            document.getElementById(
                "artists"
            );


        container.innerHTML = "";


        artists.forEach(
            function(artist) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "artist";


                div.textContent =
                    artist;


                container.appendChild(
                    div
                );

            }
        );

    }


    catch (error) {

        console.error(error);


        document.getElementById(
            "status"
        ).textContent =
            "ERROR — " +
            error.message;

    }

}


loadArtists();


</script>

</body>

</html>
